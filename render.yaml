# Render Blueprint: one PostgreSQL database, the web service and the email worker.
# Both services are built from this same repository (monolith, two processes).
# Secrets marked "sync: false" are entered in the Render dashboard, never committed.
databases:
  - name: shopflow-db
    plan: free
    databaseName: shopflow
    user: shopflow

services:
  - type: web
    name: shopflow-web
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    # Free plan has no pre-deploy step: migrate (and seed an empty database) on start.
    # Both are safe to run on every start.
    startCommand: npm run migrate && npm run seed:if-empty && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: shopflow-db, property: connectionString }
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Free plan has no background workers: run the worker inside the web process.
      # On a paid plan set this to "false" and enable the worker service below.
      - key: RUN_WORKER_IN_PROCESS
        value: "true"

  # Uncomment on a paid plan to run the email worker as a separate process.
